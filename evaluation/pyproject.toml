[project]
name = "memrelay-eval"
version = "0.1.0"
description = "Offline, treatment-neutral evaluation foundation for memrelay."
readme = "README.md"
requires-python = "==3.13.*"
dependencies = ["github-copilot-sdk==1.0.8"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
future-adapters = [
    "duckdb==1.5.5",
    "inspect-ai==0.3.252",
    "openinference-instrumentation-openai==0.1.53",
    "openinference-semantic-conventions==0.1.31",
    "opentelemetry-exporter-otlp==1.44.0",
    "opentelemetry-sdk==1.44.0",
    "pyarrow==25.0.0",
]

[project.scripts]
memrelay-eval = "memrelay_eval.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memrelay_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
